# ---------------------
# Config for 8-GPU (1 node × 8 A100 80GB) RL training
#   actor: 6 GPUs (generate rollouts with QED-Nano-SFT)
#   grader: Azure GPT-5.2 endpoint (no local GPU needed)
#   finetuning: 2 GPUs (DeepSpeed ZeRO-3)
# ---------------------
defaults:
    - base
    - _self_

model_path: lm-provers/QED-Nano-SFT
model_revision: main

eval_every_n_versions: 0  # disable eval to save time

preprocess:
  shared_memory_entry_size: 2000000000

finetune:
  attempts: 16  # same as paper
  train_batch_size: 4
  valid_batch_size: 4
  gradient_accumulation_passes: 128  # samples/step = 4*128 = 512
  seq_length: 46080  # reduced from 49920 to avoid OOM
  seq_parallel: 2  # split sequence across 2 finetune GPUs
  learning_rate: 1.0e-6
  lr_scheduler_type: constant_with_warmup
  num_warmup_steps: 0
  rl:
    entropy_bonus: 0.0001
    final_entropy_bonus: ${finetune.rl.entropy_bonus}
    overlong_filtering: false
  save_checkpoint_steps: 5  # reduced from 10 to prevent losing weights on crash
  push_to_hub: false
  hub_model_id: null
  hub_model_revision: main
  hub_ignore_patterns:
    - "*.pt"
    - "*.pth"

llm:
  parameters:
    max_tokens: 45312  # seq_length - prompt (~768 tokens)
    temperature: 0.8
  reasoning_delimiters: ["</think>"]
  wandb_table:
    enabled: true
    keep_last_k_groups: 32
    log_every_n_groups: 32

test_llm:
  parameters: 
    max_tokens: 49152
    temperature: 0.8 
    top_p: 0.95
    top_k: 20

# Grader: use external API (manually start gpt-oss-20b server in qed-eval env)
llm_grader:
  local: false
  name: openai/gpt-oss-20b 
  vllm_kwargs:
    num_nodes: 1
    data-parallel-size: 1
    tensor-parallel-size: 1
    max-num-batched-tokens: 24576
    max-num-seqs: 64
    max-model-len: 98304
    gpu-memory-utilization: 0.9
  sampling_kwargs:
    temperature: 1.0
    max_output_tokens: 81920
    reasoning:
      effort: medium
  reasoning_delimiters: ["</think>"]
  prompt_name: v1
  wandb_table:
    enabled: true
    keep_last_k_groups: 32
    log_every_n_groups: 32

actor:
  llm_max_rollouts: 16  # reduced from 20 but closer to paper
  max_retries: 10
  shared_memory_entry_size: 2000000000
  rollout_policy: pipelinerl.domains.math.generate_math_rollout
  system_prompt: null
  task_template: |-
    Generate a rigorous proof to the following question:

    {task}

environment:
  _target_: pipelinerl.domains.math.MathProofEnvironment
  model_name: ${llm_grader.name}
  sampling_kwargs: ${llm_grader.sampling_kwargs}
  prompt_name: ${llm_grader.prompt_name}

dataset_loader: pipelinerl.domains.math.load_datasets
dataset_loader_params:
  seed: 42
train_dataset_names:
  - hub_id: lm-provers/FineProofs-RL
    split: train
test_dataset_names:
  - hub_id: lm-provers/FineProofs-RL-test
    split: test
  
vllm_config:
  use_v1: false
  vllm_kwargs:
    dtype: bfloat16
    gpu-memory-utilization: 0.9
    num-scheduler-steps: 1
    disable-log-requests: ""
    disable-frontend-multiprocessing: ""
    max-num-seqs: ${actor.llm_max_rollouts}
    max-num-batched-tokens: 16384
    max-model-len: ${finetune.seq_length}
    return-tokens-as-token-ids: ""
    tensor-parallel-size: 1
    pipeline-parallel-size: 1
    generation-config: vllm

# 8 GPU allocation: 6 actor + 2 finetune (grader is Azure GPT-5.2, no local GPU)
world:
  replicas: 1
  actor_fraction: 6
  preprocessor_fraction: 0
  finetune_fraction: 2
  env_replicas: 1
  actor_group_port: 9000
  environment_start_port: 7777

wandb:
  use_wandb: true
  wandb_id: null
  wandb_name: null
  wandb_entity_name: null
  wandb_project_name: qed-nano-verify
  wandb_resume: always
  wandb_use_basename: True
  wandb_workspace_root: null
  wandb_group: null
  wandb_dir: null
  tags: ["rl-8gpu", "a100"]
  log_verifier_table: true
